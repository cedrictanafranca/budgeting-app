# XcodeGen spec. Regenerate the Xcode project with:  xcodegen generate
# (brew install xcodegen). The generated Budgeting.xcodeproj is git-ignored.
name: Budgeting
options:
  bundleIdPrefix: com.cedrictanafranca
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your Apple ID team in Xcode (Signing & Capabilities) or put the Team ID here.
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  BudgetKit:
    path: .
  BudgetPersistence:
    path: Packages/BudgetPersistence

targets:
  Budgeting:
    type: application
    platform: iOS
    sources:
      - path: App/Budgeting
    dependencies:
      - package: BudgetKit
        product: BudgetCore
      - package: BudgetKit
        product: BudgetUI
      - package: BudgetKit
        product: BudgetIntents
      - package: BudgetPersistence
        product: BudgetPersistence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cedrictanafranca.budgeting
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Budget
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Budgeting/Info.plist
      properties:
        CFBundleDisplayName: Budget
        UILaunchScreen: {}
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: App/Budgeting/Budgeting.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cedrictanafranca.budgeting

schemes:
  Budgeting:
    build:
      targets:
        Budgeting: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
